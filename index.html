  .tap:active { transform: scale(.97); opacity: .8; }

  .fade-in { animation: fadeIn .28s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* =========================================================
   狀態與工具
   ========================================================= */
const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* 預覽用：網址加上 ?now=2026-10-13T12:10（東京時間）可模擬旅途中某個時刻 */
const SIM = (() => {
  const m = /^(\d{4}-\d{2}-\d{2})T(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('now') || '');
  return m ? { date: m[1], min: +m[2] * 60 + +m[3] } : null;
})();

function tokyoNow() {
  if (SIM) return { ...SIM };
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date());
  const g = (t) => parts.find((p) => p.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (parseInt(g('hour'), 10) % 24) * 60 + parseInt(g('minute'), 10) };
}
const toMin = (t) => { const m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
const hhmm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
function fmtDur(m) {
  m = Math.round(Math.abs(m));
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? `${h} 小時 ${r} 分` : `${h} 小時`) : `${r} 分`;
}

function mapsUrl(dest, mode, origin) {
  const q = new URLSearchParams({ api: '1', destination: dest, travelmode: mode });
  if (origin) q.set('origin', origin);
  return 'https://www.google.com/maps/dir/?' + q.toString();
}

/* 每個行程的預計時段，統一換算成「東京時間的分鐘數」方便比較（台灣時間 +60） */
function schedule(day) {
  const abs = (t, tw) => toMin(t) + (tw ? 60 : 0);
  return day.items.map((it, i) => {
    const start = abs(it.t, it.tw);
    const next = day.items[i + 1];
    const end = it.end ? abs(it.end, it.tw) : next ? abs(next.t, next.tw) : start + 30;
    const local = (m) => hhmm(m - (it.tw ? 60 : 0)); // 以該行程所在時區顯示
    return { start, end, local };
  });
}

/* 進度：以使用者點「我在這」的行程為基準 */
function progress(dayIdx) {
  if (dayIdx !== todayIdx) return null;
  const raw = store.get('here-' + DAYS[dayIdx].date);
  if (raw == null) return null;
  const at = +raw;
  const sc = schedule(DAYS[dayIdx])[at];
  if (!sc) return null;
  const now = tokyo.min;
  if (now < sc.start) return { at, kind: 'ahead', diff: sc.start - now, shift: now - sc.start };
  if (now <= sc.end)  return { at, kind: 'ontime', left: sc.end - now, shift: 0 };
  return { at, kind: 'behind', diff: now - sc.end, shift: now - sc.end };
}

let tokyo = tokyoNow();
let todayIdx = DAYS.findIndex((d) => d.date === tokyo.date);

const state = {
  day: todayIdx >= 0 ? todayIdx : Math.min(+(store.get('day') || 0), DAYS.length - 1),
  tab: store.get('tab') === 'route' ? 'route' : 'plan',
};

/* 依表定時間，現在應該在哪個行程（只有旅途當天才標示） */
function currentItemIndex(dayIdx) {
  if (dayIdx !== todayIdx) return -1;
  let idx = -1;
  schedule(DAYS[dayIdx]).forEach((sc, i) => { if (sc.start <= tokyo.min) idx = i; });
  return idx;
}

  else s = `旅程第 ${todayIdx + 1} 天・今天`;
  $('#status').textContent = s;
}

function progressBanner(d, sc, pg) {
  if (state.day !== todayIdx) return '';
  if (!pg) {
    return `
      <section class="fade-in rounded-2xl bg-white dark:bg-neutral-900 shadow-sm p-3.5 mb-4 flex items-center gap-3">
        <span class="text-[22px]">📍</span>
        <p class="text-[13.5px] text-neutral-600 dark:text-neutral-300 leading-snug">
          抵達景點時點卡片上的 <b>「我在這」</b>，就能知道進度是超前還是落後。
        </p>
      </section>`;
  }
  const it = d.items[pg.at], s = sc[pg.at];
  let bg, head, sub;
  if (pg.kind === 'ahead') {
    bg = 'linear-gradient(135deg,#10B981,#059669)';
    head = `超前 ${fmtDur(pg.diff)}`;
    sub = `「${it.title}」表定 ${s.local(s.start)} 開始，時間很充裕`;
  } else if (pg.kind === 'ontime') {
    bg = pg.left <= 10 ? 'linear-gradient(135deg,#F59E0B,#EA580C)' : 'linear-gradient(135deg,#3B82F6,#2563EB)';
    head = pg.left <= 10 ? '該準備出發了' : '進度準時 👍';
    sub = `表定 ${s.local(s.end)} 離開「${it.title}」，還有 ${fmtDur(pg.left)}`;
  } else {
    bg = pg.diff <= 15 ? 'linear-gradient(135deg,#F59E0B,#EA580C)' : 'linear-gradient(135deg,#F43F5E,#DC2626)';
    head = `落後 ${fmtDur(pg.diff)}`;
    sub = `表定 ${s.local(s.end)} 就該離開「${it.title}」，後面行程約延後 ${fmtDur(pg.diff)}`;
  }
  return `
    <section class="fade-in rounded-2xl p-4 mb-4 text-white shadow-md" style="background:${bg}">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-[12px] font-semibold opacity-90">現在 ${hhmm(tokyo.min)} · 你在 ${it.icon} ${it.title}</p>
          <p class="text-[24px] font-bold leading-tight mt-0.5 tabular">${head}</p>
          <p class="text-[13px] opacity-95 mt-1 leading-snug">${sub}</p>
        </div>
        <button data-clear-here class="tap shrink-0 rounded-full bg-white/20 text-[12px] font-semibold px-3 py-1.5">重設</button>
      </div>
    </section>`;
}

          <div class="rounded-2xl bg-white dark:bg-neutral-900 p-3.5 shadow-sm ${isHere ? 'ring-2 ring-rose-500' : isNow ? 'ring-2 ring-rose-500/50' : ''}">
            ${isNow ? '<p class="text-[11px] font-bold text-rose-600 dark:text-rose-400 mb-1">● 表定現在</p>' : ''}
            <div class="flex items-start gap-2.5">
              <span class="text-[22px] leading-none mt-0.5">${it.icon}</span>
              <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-[16px] font-semibold leading-snug">${it.title}</h3>
                  ${hereBtn}
                </div>
                ${it.note ? `<p class="text-[13.5px] text-neutral-500 dark:text-neutral-400 mt-1 leading-relaxed whitespace-pre-line">${it.note}</p>` : ''}
                <p class="text-[12px] text-neutral-400 mt-1.5 tabular">⏱ 預計約 ${fmtDur(s.end - s.start)}</p>
                ${tags ? `<div class="flex flex-wrap gap-1.5 mt-2">${tags}</div>` : ''}
                ${nowHint}${projected}
              </div>
            </div>
            ${legRow}
          </div>
        </div>
      </li>`;
  }).join('');

  return hero(d, state.day) + progressBanner(d, sc, pg) + `<ol class="relative">${rows}</ol>` + tipsBlock(d);
}

/* ---------- 交通 ---------- */
function stepsList(steps) {
  return `<ol class="space-y-2">${steps.map(([k, text, dur]) => `
    <li class="flex items-start gap-2">
      <div class="shrink-0">${stepChip(k)}</div>
      <p class="flex-1 text-[14px] leading-snug pt-px">${text}</p>
      ${dur ? `<span class="text-[12px] text-neutral-400 whitespace-nowrap tabular pt-0.5">${dur}</span>` : ''}
    </li>`).join('')}</ol>`;
}

function navButtons(o, dest, mode) {
  if (!mode) return '';
  return `
    <div class="grid grid-cols-[1fr_auto] gap-2 mt-4">
      <a href="${mapsUrl(dest, mode, o)}" target="_blank" rel="noopener"
        class="tap flex items-center justify-center gap-1.5 rounded-xl bg-[#007AFF] text-white text-[15px] font-semibold py-3">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3a1 1 0 0 0-1.05-.23l-18 7a1 1 0 0 0 .08 1.89l7.6 2.24 2.24 7.6a1 1 0 0 0 .93.72h.03a1 1 0 0 0 .93-.64l7-18a1 1 0 0 0-.2-1.08Z"/></svg>
        Google Maps 導航
      </a>
      <a href="${mapsUrl(dest, mode)}" target="_blank" rel="noopener"
        class="tap flex items-center justify-center rounded-xl bg-[#007AFF]/10 dark:bg-[#0A84FF]/20 text-[#007AFF] dark:text-[#0A84FF] text-[13px] font-semibold px-3.5 py-3">
        從目前位置
      </a>
    </div>`;
}

function renderRoute() {
  const d = DAYS[state.day];
  const cards = d.legs.map((leg, i) => {
    const alt = leg.alt ? `
      <details class="mt-3 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 group">
        <summary class="list-none cursor-pointer flex items-center justify-between px-3 py-2.5 text-[14px] font-semibold">
          <span>替代方案：${leg.alt.label} <span class="font-normal text-neutral-500 dark:text-neutral-400">· ${leg.alt.dur}</span></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-neutral-400 transition-transform group-open:rotate-90"><path d="m9 6 6 6-6 6"/></svg>
        </summary>
        <div class="px-3 pb-3">${stepsList(leg.alt.steps)}${navButtons(leg.o, leg.d, leg.alt.mode)}</div>
      </details>` : '';

    return `
      <article id="leg-${leg.id}" class="fade-in rounded-2xl bg-white dark:bg-neutral-900 p-4 shadow-sm mb-3" style="animation-delay:${i * 35}ms">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 text-[16px] font-semibold">
              <span class="w-2.5 h-2.5 rounded-full border-2 shrink-0" style="border-color:${d.color[0]}"></span>
              <span class="truncate">${leg.from}</span>
            </div>
            <div class="ml-[4px] my-0.5 h-3 border-l-2 border-dotted border-neutral-300 dark:border-neutral-600"></div>
            <div class="flex items-center gap-2 text-[16px] font-semibold">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${d.color[0]}"></span>
              <span class="truncate">${leg.to}</span>
            </div>
          </div>
          <span class="shrink-0 rounded-full bg-neutral-100 dark:bg-neutral-800 text-[12.5px] font-semibold px-2.5 py-1 tabular">${leg.dur}</span>
        </div>
        <div class="h-px bg-neutral-200/80 dark:bg-neutral-800 my-3.5"></div>
        ${stepsList(leg.steps)}
        ${leg.warn ? `<p class="mt-3 text-[13px] text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-400/10 rounded-lg px-2.5 py-2">⚠️ ${leg.warn}</p>` : ''}
        ${navButtons(leg.o, leg.d, leg.mode)}
        ${alt}
      </article>`;
  }).join('');

  const legend = `
    <p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 mb-3 px-1 leading-relaxed">
      「Google Maps 導航」用行程中的起點規劃；「從目前位置」以你現在的 GPS 位置出發。全程刷 Suica 即可。
    </p>`;
  return hero(d, state.day) + legend + cards;
}

/* ---------- 主渲染 ---------- */
function render(opts = {}) {
  $('#pageTitle').textContent = state.tab === 'plan' ? '行程' : '交通';
  document.querySelectorAll('.tab-btn').forEach((b) => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('text-rose-600', on);
    b.classList.toggle('dark:text-rose-400', on);
    b.classList.toggle('text-neutral-400', !on);
  });
  if (!opts.quiet) renderPills();
  $('#view').classList.toggle('quiet', !!opts.quiet);
  $('#view').innerHTML = state.tab === 'plan' ? renderPlan() : renderRoute();
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
  store.set('day', state.day);
  store.set('tab', state.tab);
}

function setDay(i) {
  if (i < 0 || i >= DAYS.length || i === state.day) return;
  state.day = i;
  render();
}

/* =========================================================
   互動
   ========================================================= */
document.addEventListener('click', (e) => {
  const pill = e.target.closest('[data-day]');
  if (pill) return setDay(+pill.dataset.day);

  const tab = e.target.closest('[data-tab]');
  if (tab) { if (tab.dataset.tab !== state.tab) { state.tab = tab.dataset.tab; render(); } else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const here = e.target.closest('[data-here]');
  if (here) {
    const key = 'here-' + DAYS[state.day].date;
    if (store.get(key) === here.dataset.here) store.del(key); else store.set(key, here.dataset.here);
    render({ keepScroll: true, quiet: true });
    return;
  }
  if (e.target.closest('[data-clear-here]')) {
    store.del('here-' + DAYS[state.day].date);
    render({ keepScroll: true, quiet: true });
    return;
  }

  const go = e.target.closest('[data-goleg]');
  if (go) {
    state.tab = 'route';
    render();
    const el = document.getElementById('leg-' + go.dataset.goleg);
    if (el) {
      const headerH = document.querySelector('header').offsetHeight;
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - headerH - 12, behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }
});

/* 左右滑動切換天數 */
let sx = 0, sy = 0, st = 0;
const main = $('#view');
main.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
main.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) setDay(state.day + (dx < 0 ? 1 : -1));
}, { passive: true });

/* 回到前景時更新「現在」標示 */
function refreshClock() {
  tokyo = tokyoNow();
  todayIdx = DAYS.findIndex((d) => d.date === tokyo.date);
  renderStatus();
  render({ keepScroll: true, quiet: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClock(); });
setInterval(() => { if (!document.hidden && !SIM && state.tab === 'plan' && state.day === todayIdx) refreshClock(); }, 60000);

/* 主畫面圖示（iOS 需要 PNG，這裡用 canvas 產生） */
(function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#F43F5E'); g.addColorStop(1, '#FB923C');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = 'bold 64px -apple-system, "PingFang TC", sans-serif';
    x.fillText('東京', 90, 78);
    x.font = '600 26px -apple-system, sans-serif';
    x.globalAlpha = .9; x.fillText('10/12 – 10/17', 90, 130);
    $('#touchIcon').href = c.toDataURL('image/png');
  } catch (e) {}
})();

renderStatus();
render();
</script>
</body>
</html>
