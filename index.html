<style>
  :root { color-scheme: light dark; }
  html, body {
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
    background: #F2F2F7;
    -webkit-user-select: none; user-select: none;
  }
  @media (prefers-color-scheme: dark) { body { background: #000; } }

  .safe-top    { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .main-pad    { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  .glass {
    background: rgba(242,242,247,.82);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  .glass-bar {
    background: rgba(249,249,249,.88);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  @media (prefers-color-scheme: dark) {
    .glass     { background: rgba(0,0,0,.78); }
    .glass-bar { background: rgba(22,22,24,.88); }
  }

  .tap { transition: transform .12s ease, opacity .12s ease; }
  .tap:active { transform: scale(.97); opacity: .8; }

  .fade-in { animation: fadeIn .28s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .flash { animation: flash 1.4s ease; }
  @keyframes flash {
    0%, 60% { box-shadow: 0 0 0 3px rgba(225,29,72,.55); }
    100%    { box-shadow: 0 0 0 3px rgba(225,29,72,0); }
  }

  .now-dot::after {
    content: ""; position: absolute; inset: -5px; border-radius: 9999px;
    border: 2px solid #E11D48; animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  .tabular { font-variant-numeric: tabular-nums; }
  .quiet .fade-in { animation: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  .sheet-in { animation: sheetIn .26s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>

const $ = (s) => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* 預覽用：網址加上 ?now=2026-10-13T12:10（東京時間）可模擬旅途中某個時刻 */
const SIM = (() => {
  const m = /^(\d{4}-\d{2}-\d{2})T(\d{1,2}):(\d{2})$/.exec(new URLSearchParams(location.search).get('now') || '');
  return m ? { date: m[1], min: +m[2] * 60 + +m[3] } : null;
})();

function tokyoNow() {
  if (SIM) return { ...SIM };
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date());
  const g = (t) => parts.find((p) => p.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: (parseInt(g('hour'), 10) % 24) * 60 + parseInt(g('minute'), 10) };
}
const toMin = (t) => { const m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 86400000);
const hhmm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
function fmtDur(m) {
  m = Math.round(Math.abs(m));
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? `${h} 小時 ${r} 分` : `${h} 小時`) : `${r} 分`;
}

function mapsUrl(dest, mode, origin) {
  const q = new URLSearchParams({ api: '1', destination: dest, travelmode: mode });
  if (origin) q.set('origin', origin);
  return 'https://www.google.com/maps/dir/?' + q.toString();
}
const searchUrl = (q) => 'https://www.google.com/maps/search/?' + new URLSearchParams({ api: '1', query: q }).toString();

/* 只接受 http(s) 網址；沒寫 https:// 的自動補上，其餘（javascript: 等）回傳 null */
function safeUrl(s) {
  s = String(s ?? '').trim();
  if (!s) return null;
  if (!/^[a-z][a-z\d+.-]*:/i.test(s)) s = 'https://' + s;
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null; } catch (e) { return null; }
}

/* 分享或下載檔案（iPhone 優先用分享選單，可存到「檔案」或傳 LINE） */
async function saveFile(name, text, type, share) {
  const file = new File([text], name, { type });
  if (share && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

/* 每個行程的預計時段，統一換算成「東京時間的分鐘數」方便比較（台灣時間 +60） */
function schedule(day) {
  const abs = (t, tw) => toMin(t) + (tw ? 60 : 0);
  return day.items.map((it, i) => {
    const start = abs(it.t, it.tw);
    const next = day.items[i + 1];
    const end = it.end ? abs(it.end, it.tw) : next ? abs(next.t, next.tw) : start + 30;
    const local = (m) => hhmm(m - (it.tw ? 60 : 0)); // 以該行程所在時區顯示
    return { start, end, local };
  });
}

/* 預約／票券：有標籤（已預約、門票…）、搭飛機或標 ticket 的行程，票券內容只存在本機 */
const isTicket = (it) => it.ticket || it.tags?.length || it.icon === '✈️';
const SLOTS = DAYS.flatMap((d, di) => {
  const sc = schedule(d);
  return d.items.flatMap((it, i) => isTicket(it)
    ? [{ key: `${d.date}|${it.title}`, di, i, date: d.date, it, start: sc[i].start }] : []);
});
const nextSlot = () => SLOTS.find((x) => x.date > tokyo.date || (x.date === tokyo.date && x.start > tokyo.min)) || null;
const minsUntil = (x) => dayDiff(x.date, tokyo.date) * 1440 + x.start - tokyo.min;
const untilText = (m) => m >= 1440 ? `${Math.floor(m / 1440)} 天後` : `還有 ${fmtDur(m)}`;

/* 進度：以使用者點「我在這」的行程為基準 */
function progress(dayIdx) {
  if (dayIdx !== todayIdx) return null;
  const raw = store.get('here-' + DAYS[dayIdx].date);
  if (raw == null) return null;
  const at = +raw;
  const sc = schedule(DAYS[dayIdx])[at];
  if (!sc) return null;
  const now = tokyo.min;
  if (now < sc.start) return { at, kind: 'ahead', diff: sc.start - now, shift: now - sc.start };
  if (now <= sc.end)  return { at, kind: 'ontime', left: sc.end - now, shift: 0 };
  return { at, kind: 'behind', diff: now - sc.end, shift: now - sc.end };
}

let tokyo = tokyoNow();
let todayIdx = DAYS.findIndex((d) => d.date === tokyo.date);

const state = {
  day: todayIdx >= 0 ? todayIdx : Math.min(+(store.get('day') || 0), DAYS.length - 1),
  tab: ['route', 'ticket', 'calc', 'tools'].includes(store.get('tab')) ? store.get('tab') : 'plan',
  wallet: store.get('wallet') === 'ledger' ? 'ledger' : 'calc',
};

/* 依表定時間，現在應該在哪個行程（只有旅途當天才標示） */
function currentItemIndex(dayIdx) {
  if (dayIdx !== todayIdx) return -1;
  let idx = -1;
  schedule(DAYS[dayIdx]).forEach((sc, i) => { if (sc.start <= tokyo.min) idx = i; });
  return idx;
}

/* 旅途當天依營業時間標示是否營業 */
function openBadge(hours) {
  if (state.day !== todayIdx) return '';
  const m = /(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/.exec(hours || '');
  if (!m) return '';
  const o = +m[1] * 60 + +m[2], c = +m[3] * 60 + +m[4], now = tokyo.min;
  const [cls, txt] = now < o ? ['bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300', `${m[1]}:${m[2]} 開門`]
    : now >= c ? ['bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300', '已打烊']
    : c - now <= 45 ? ['bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300', `${fmtDur(c - now)}後打烊`]
    : ['bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300', '營業中'];
  return `<span class="rounded-full text-[10.5px] font-semibold px-1.5 py-px whitespace-nowrap ${cls}">${txt}</span>`;
}

/* Google Maps 手機版中途點有上限，每段最多 5 個點（起點＋3 中途＋終點），超過就分段 */
function walkRoutes(stops) {
  const out = [];
  for (let a = 0; a < stops.length - 1; a += 4) {
    const seg = stops.slice(a, a + 5);
    const q = new URLSearchParams({ api: '1', origin: seg[0].q, destination: seg[seg.length - 1].q, travelmode: 'walking' });
    if (seg.length > 2) q.set('waypoints', seg.slice(1, -1).map((s) => s.q).join('|'));
    out.push({ url: 'https://www.google.com/maps/dir/?' + q.toString(), label: `${seg[0].k} → ${seg[seg.length - 1].k}` });
  }
  return out;
}

function shopsToggle(it, i, open) {

  const n = it.shops.list.filter((s) => isPicked(picks, i, s)).length;

      <span class="flex-1 min-w-0 text-[13.5px] font-semibold">候選店家 ${it.shops.list.length} 家
        <span class="font-normal text-neutral-500 dark:text-neutral-400">· 已選 ${n} 家</span></span>
      <span class="text-[12px] text-neutral-500 dark:text-neutral-400">${open ? '收合' : '展開'}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        class="text-neutral-400 shrink-0 transition-transform ${open ? 'rotate-90' : ''}"><path d="m9 6 6 6-6 6"/></svg>

}

function shopRow(s, i, picked, color) {
  const noteCls = s.flag === 'drop' ? 'text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-500/10'
    : s.flag === 'maybe' ? 'text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-400/10'
    : 'text-neutral-600 dark:text-neutral-300 bg-neutral-100 dark:bg-neutral-800';

        style="${picked ? `background:${color};border-color:${color}` : ''}">
        ${picked ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ''}
      </button>
      <div class="min-w-0 flex-1 ${picked ? '' : 'opacity-50'}">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="shrink-0 min-w-[20px] h-5 px-1 rounded-md text-[11px] font-bold flex items-center justify-center text-white" style="background:${color}">${s.k}</span>
          <span class="text-[14.5px] font-semibold leading-snug">${s.name}</span>
          ${openBadge(s.hours)}
        </div>
        <p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 mt-1 leading-snug">📍 ${s.addr}</p>
        ${meta ? `<p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 leading-snug tabular">${meta}</p>` : ''}
        ${s.desc ? `<p class="text-[13px] mt-1 leading-snug">${s.desc}</p>` : ''}
        ${wishBadge(DAYS[state.day].date, s)}
        ${s.note ? `<p class="text-[12.5px] mt-1.5 rounded-lg px-2 py-1 leading-snug ${noteCls}">${s.flag === 'drop' ? '🔴 ' : s.flag === 'maybe' ? '🟡 ' : '💡 '}${s.note}</p>` : ''}
      </div>
      <a href="${mapsUrl(s.q, 'walking')}" target="_blank" rel="noopener"
        class="tap shrink-0 self-center rounded-full bg-[#007AFF]/10 dark:bg-[#0A84FF]/20 text-[#007AFF] dark:text-[#0A84FF] text-[12px] font-semibold px-2.5 py-1.5">導航</a>
    </li>`;
}

function shopsPanel(it, i, s, color) {
  const sh = it.shops, picks = readJson(picksKey());
  const main = sh.list.filter((x) => !x.extra), extra = sh.list.filter((x) => x.extra);
  const chosen = sh.list.filter((x) => isPicked(picks, i, x));
  const [lo, hi] = chosen.reduce(([a, b], x) => { const [p, q] = minRange(x.stay); return [a + p, b + q]; }, [0, 0]);
  const avail = s.end - s.start;
  const [fitCls, fitTxt] = lo > avail ? ['text-rose-600 dark:text-rose-400', '時間不夠，建議刪掉幾家']
    : hi > avail ? ['text-amber-600 dark:text-amber-400', '有點趕']
    : ['text-emerald-600 dark:text-emerald-400', '時間足夠'];
  const row = (x) => shopRow(x, i, isPicked(picks, i, x), color);

  /* 照清單順序串起勾選的店 */
  const ordered = [...main, ...extra].filter((x) => isPicked(picks, i, x));
  const routes = ordered.length >= 2 ? walkRoutes(ordered) : [];
  const routeBtns = ordered.length === 0
    ? '<p class="text-[12.5px] text-neutral-500 dark:text-neutral-400">還沒選店家，勾選想去的店就會幫你串成路線。</p>'
    : ordered.length === 1
      ? `<a href="${mapsUrl(ordered[0].q, 'walking')}" target="_blank" rel="noopener" class="tap flex items-center justify-center gap-1.5 rounded-xl bg-[#007AFF] text-white text-[14px] font-semibold py-2.5">🗺 導航到 ${ordered[0].name}</a>`
      : `<div class="grid ${routes.length > 1 ? 'grid-cols-2' : ''} gap-2">${routes.map((r) => `
          <a href="${r.url}" target="_blank" rel="noopener" class="tap flex items-center justify-center gap-1.5 rounded-xl bg-[#007AFF] text-white text-[14px] font-semibold py-2.5">
            🗺 ${routes.length > 1 ? `路線 ${r.label}` : `步行路線（${ordered.length} 家）`}</a>`).join('')}</div>`;

  return `
    <div class="mt-2 rounded-xl border border-neutral-200/80 dark:border-neutral-800 px-3 pt-2.5 pb-3">
      ${sh.hint ? `<p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 leading-snug mb-1">🧭 ${sh.hint}</p>` : ''}
      <ul>${main.map(row).join('')}</ul>
      ${extra.length ? `
        <p class="text-[12px] font-bold text-neutral-500 dark:text-neutral-400 mt-2 pt-2.5 border-t border-dashed border-neutral-300 dark:border-neutral-700">時間有剩再逛（同一條路線，不用繞路）</p>
        <ul>${extra.map(row).join('')}</ul>` : ''}
      <div class="mt-2 pt-2.5 border-t border-neutral-200/70 dark:border-neutral-800">
        <div class="flex items-center justify-between gap-2 mb-2">
          <p class="text-[12.5px] leading-snug tabular">
            已選 <b>${chosen.length}</b> 家，約 ${lo === hi ? fmtDur(lo) : `${fmtDur(lo)}–${fmtDur(hi)}`}
            <span class="text-neutral-500 dark:text-neutral-400">（可用 ${fmtDur(avail)}，不含走路）</span>
            <b class="${fitCls}">${fitTxt}</b>
          </p>
          <button data-reset-picks="${i}" class="tap shrink-0 text-[12px] font-semibold text-neutral-500 dark:text-neutral-400 px-1">重設</button>
        </div>
        ${routeBtns}
      </div>
    </div>`;
}

function renderPlan() {
  const d = DAYS[state.day];
  const sc = schedule(d);
  const cur = currentItemIndex(state.day);
  const pg = progress(state.day);
  const isToday = state.day === todayIdx;
  const legById = Object.fromEntries(d.legs.map((l) => [l.id, l]));
  const wx = wxDay(d.date);

  const rows = d.items.map((it, i) => {
    const s = sc[i];
    const leg = it.leg && legById[it.leg];
    const isNow = i === cur;
    const isHere = pg && pg.at === i;
    const isLast = i === d.items.length - 1;
    const rainAt = rainDuring(wx, s, it);
    const tags = (it.tags || []).map((t) =>
      `<span class="rounded-full bg-rose-100 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300 text-[11px] font-semibold px-2 py-0.5">${t}</span>`).join('')
      + (rainAt != null ? `<span class="rounded-full bg-sky-100 dark:bg-sky-400/15 text-sky-700 dark:text-sky-300 text-[11px] font-semibold px-2 py-0.5">☂️ 約 ${rainAt}:00 可能下雨</span>` : '');
    const legRow = leg ? `
      <button data-goleg="${leg.id}" class="tap mt-3 w-full flex items-center gap-2 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 px-2.5 py-2 text-left">
        <div class="flex flex-wrap gap-1 flex-1 min-w-0">${[...new Set(leg.steps.map((st) => st[0]))].map(stepChip).join('')}</div>
        <span class="text-[12px] text-neutral-500 dark:text-neutral-400 whitespace-nowrap tabular">${leg.dur}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-neutral-400 shrink-0"><path d="m9 6 6 6-6 6"/></svg>
      </button>` : '';

    const open = it.shops && shopsOpen(i);
    const shops = it.shops ? shopsToggle(it, i, open) + (open ? shopsPanel(it, i, s, d.color[0]) : '') : '';

    /* 依目前進度推估的時間（只顯示在「我在這」之後、且差距 ≥ 5 分的行程） */
    const projected = pg && i > pg.at && Math.abs(pg.shift) >= 5 ? `
      <p class="mt-2 inline-flex items-center gap-1 rounded-lg px-2 py-1 text-[12px] font-semibold tabular
        ${pg.shift > 0 ? 'bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300'}">
        ${pg.shift > 0 ? '⏳' : '⏩'} 依目前進度約 ${s.local(s.start + pg.shift)} 開始（${pg.shift > 0 ? '晚' : '早'} ${fmtDur(pg.shift)}）
      </p>` : '';

    /* 沒按「我在這」時，依表定提示剩餘時間 */
    const nowHint = isNow && !pg ? `
      <p class="text-[12px] font-semibold text-rose-600 dark:text-rose-400 mt-2 tabular">
        ${tokyo.min <= s.end ? `表定 ${s.local(s.end)} 前往下一站 · 還有 ${fmtDur(s.end - tokyo.min)}` : `表定 ${s.local(s.end)} 已結束`}
      </p>` : '';

    const hereBtn = isToday ? `
      <button data-here="${i}" class="tap shrink-0 rounded-full text-[11.5px] font-semibold px-2.5 py-1 whitespace-nowrap
        ${isHere ? 'bg-rose-600 text-white' : 'bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300'}">
        📍 ${isHere ? '你在這' : '我在這'}
      </button>` : '';

    return `
      <li class="relative flex gap-3 fade-in" style="animation-delay:${i * 35}ms">
        <div class="w-[52px] shrink-0 text-right pt-3.5 tabular">
          <div class="text-[14px] font-bold leading-tight ${isNow ? 'text-rose-600 dark:text-rose-400' : 'text-neutral-700 dark:text-neutral-200'}">${it.t}</div>
          <div class="text-[11.5px] text-neutral-400 leading-tight mt-0.5">– ${it.endLabel || s.local(s.end)}</div>
          ${it.endNote ? `<div class="text-[9.5px] text-neutral-400 leading-tight">(${it.endNote})</div>` : ''}
          ${it.tw ? '<div class="text-[10px] text-sky-600 dark:text-sky-400 font-semibold mt-1">台灣時間</div>' : ''}
        </div>
        <div class="relative w-3 shrink-0 flex justify-center">
          ${isLast ? '' : '<span class="absolute top-5 -bottom-3 w-[2px] bg-neutral-300/70 dark:bg-neutral-700"></span>'}
          <span class="relative mt-[18px] w-3 h-3 rounded-full ring-4 ring-[#F2F2F7] dark:ring-black ${isNow ? 'now-dot' : ''}"
            style="background:${isNow ? '#E11D48' : d.color[0]}"></span>
        </div>
        <div class="flex-1 min-w-0 pb-3">
          <div class="rounded-2xl bg-white dark:bg-neutral-900 p-3.5 shadow-sm ${isHere ? 'ring-2 ring-rose-500' : isNow ? 'ring-2 ring-rose-500/50' : ''}">
            ${isNow ? '<p class="text-[11px] font-bold text-rose-600 dark:text-rose-400 mb-1">● 表定現在</p>' : ''}
            <div class="flex items-start gap-2.5 ${it.shops ? 'cursor-pointer' : ''}" ${it.shops ? `data-toggle-shops="${i}"` : ''}>
              <span class="text-[22px] leading-none mt-0.5">${it.icon}</span>
              <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-2">
                  <h3 class="text-[16px] font-semibold leading-snug">${it.title}</h3>
                  ${hereBtn}
                </div>
                ${it.note ? `<p class="text-[13.5px] text-neutral-500 dark:text-neutral-400 mt-1 leading-relaxed whitespace-pre-line">${it.note}</p>` : ''}
                <p class="text-[12px] text-neutral-400 mt-1.5 tabular">⏱ 預計約 ${fmtDur(s.end - s.start)}</p>
                ${tags ? `<div class="flex flex-wrap gap-1.5 mt-2">${tags}</div>` : ''}
                ${nowHint}${projected}
              </div>
            </div>
            ${shops}
            ${legRow}
          </div>
        </div>
      </li>`;
  }).join('');

  return hero(d, state.day) + weatherCard(d) + bringCard(d) + nextBanner() + progressBanner(d, sc, pg) + `<ol class="relative">${rows}</ol>` + tipsBlock(d);
}

/* 當天要帶的東西（勾選狀態存本機） */
function bringCard(d) {
  if (!d.bring?.length) return '';
  const done = readJson('bring-' + d.date);
  const n = d.bring.filter((x) => done[x]).length;
  const chips = d.bring.map((x) => `
    <button data-bring="${esc(x)}" class="tap inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[13px] font-semibold
      ${done[x] ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300 line-through decoration-2' : 'bg-neutral-100 dark:bg-neutral-800'}">
      ${done[x] ? '✓' : '○'} ${esc(x)}</button>`).join('');
  return `
    <section class="fade-in rounded-2xl bg-white dark:bg-neutral-900 shadow-sm p-4 mb-4">
      <p class="text-[14px] font-semibold mb-2">🎒 ${state.day === todayIdx ? '今天' : '這天'}要帶
        <span class="font-normal text-[12.5px] ${n === d.bring.length ? 'text-emerald-600 dark:text-emerald-400' : 'text-neutral-500 dark:text-neutral-400'}">· ${n}/${d.bring.length}${n === d.bring.length ? ' 都帶了 👍' : ''}</span></p>
      <div class="flex flex-wrap gap-1.5">${chips}</div>
    </section>`;
}

/* 旅途當天：下一個預約倒數 */
function nextBanner() {
  if (state.day !== todayIdx) return '';

  if (!n || n.date !== tokyo.date) return '';
  return `
    <button data-tab="ticket" class="tap fade-in w-full flex items-center gap-3 rounded-2xl bg-white dark:bg-neutral-900 shadow-sm p-3.5 mb-4 text-left">
      <span class="text-[22px]">🎫</span>
      <span class="flex-1 min-w-0">

      <span class="text-[12.5px] font-semibold text-neutral-500 dark:text-neutral-400 whitespace-nowrap">看票券 ›</span>

}

function renderRoute() {
  const d = DAYS[state.day];
  const cards = d.legs.map((leg, i) => {
    const alt = leg.alt ? `
      <details class="mt-3 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 group">

              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${d.color[0]}"></span>

        <div class="h-px bg-neutral-200/80 dark:bg-neutral-800 my-3.5"></div>

/* ---------- 匯率計算器 ---------- */
const CALC_DEF = { price: '', rate: 0, tax: false, disc: false, pct: 5, at: 0, twd: '' };
const RATE_API = 'https://api.exchangerate-api.com/v4/latest/TWD';
const calcCfg = () => ({ ...CALC_DEF, ...readJson('calc') });
const saveCalc = (patch) => store.set('calc', JSON.stringify({ ...calcCfg(), ...patch }));
const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');
const ntd = (n) => 'NT$' + Math.round(n).toLocaleString('zh-TW');

function toggleRow(key, on, title, sub) {

      <span class="relative w-[51px] h-[31px] shrink-0 rounded-full bg-neutral-200 dark:bg-neutral-700 transition-colors peer-checked:bg-emerald-500
        after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:w-[27px] after:h-[27px] after:rounded-full after:bg-white after:shadow after:transition-transform peer-checked:after:translate-x-[20px]"></span>
    </label>`;
}

/* 只更新結果區，避免重繪讓輸入框失去焦點 */
function updateCalc() {
  const out = $('#calcOut');
  if (!out) return;
  const c = calcCfg();
  const r0 = +c.rate || 0;
  $('#calcRate').textContent = r0 ? `¥1 = NT$${r0.toFixed(4)}（NT$1 = ¥${(1 / r0).toFixed(2)}）` : '匯率尚未取得';
  $('#calcRateNote').textContent = (c.at ? `匯率更新：${new Date(c.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}` : '連網後會自動取得匯率')
    + '・刷卡另有約 1.5% 海外手續費';
  const { price, pct, afterDisc, pay } = calcAmounts(c), rate = r0;
  $('#calcTwdOut').textContent = rate ? yen(Math.max(0, +c.twd || 0) / rate) : '¥ —';
  const row = (k, v) => `<div class="flex justify-between"><span class="opacity-85">${k}</span><span class="tabular font-semibold">${v}</span></div>`;
  const rows = [row('標價', yen(price))];
  if (c.disc && pct) rows.push(row(`折扣 ${pct}%`, '−' + yen(price - afterDisc)));
  if (c.tax) rows.push(row('免稅 10%', '−' + yen(afterDisc - pay)));
  const saved = price - pay;
  out.innerHTML = `
    <p class="text-[13px] font-semibold opacity-90">實際約付台幣</p>
    <p class="text-[42px] font-bold leading-tight tabular">${rate ? ntd(pay * rate) : 'NT$ —'}</p>
    <p class="text-[15px] opacity-90 tabular">實付 ${yen(pay)}${saved >= 1 ? `・省下 ${yen(saved)}${rate ? `（${ntd(saved * rate)}）` : ''}` : ''}</p>
    ${rows.length > 1 ? `<div class="mt-3 pt-3 border-t border-white/25 space-y-1 text-[13.5px]">${rows.join('')}</div>` : ''}`;
}

async function fetchRate() {
  const note = $('#calcRateNote');
  if (note) note.textContent = '更新中…';
  try {
    const r = await fetch(RATE_API, { cache: 'no-store' });
    const jpy = (await r.json())?.rates?.JPY;   // 1 TWD = ? JPY
    if (!(jpy > 0)) throw new Error('no rate');
    saveCalc({ rate: 1 / jpy, at: Date.now() });
  } catch (e) {
    const c = calcCfg();
    if (note) note.textContent = c.rate ? '匯率更新失敗（離線？），先沿用上次取得的匯率' : '匯率取得失敗，請連網後按「更新」';
    return;
  }
  if (state.tab === 'calc' && state.wallet === 'ledger') render({ keepScroll: true, quiet: true });
  else updateCalc();
}

/* 標價 → 折扣後（仍含稅）→ 實付 */
function calcAmounts(c = calcCfg()) {
  const price = Math.max(0, +c.price || 0), pct = Math.min(100, Math.max(0, +c.pct || 0));
  const afterDisc = c.disc ? price * (1 - pct / 100) : price;
  return { price, pct, afterDisc, pay: c.tax ? afterDisc / 1.1 : afterDisc };
}

/* ---------- 記帳＋兩人分帳 ---------- */
const CATS = [['food', '🍜 餐飲'], ['traffic', '🚃 交通'], ['shop', '🛍️ 購物'], ['ticket', '🎟️ 門票'], ['other', '📦 其他']];
const PAYS = [['cash', '💴 現金'], ['card', '💳 信用卡'], ['paypay', '📱 PayPay'], ['suica', '🚃 Suica']];
const catOf = (k) => (CATS.find((c) => c[0] === k) || CATS[4])[1];
const payOf = (k) => (PAYS.find((c) => c[0] === k) || PAYS[0])[1];
const names = () => { const n = readJson('ledger-cfg').names; return Array.isArray(n) && n.length === 2 ? n : ['我', '旅伴']; };
const ledger = () => readArr('ledger');
const asNtd = (y) => { const r = +calcCfg().rate; return r ? ntd(y * r) : ''; };

function ledgerStats(list) {
  const paid = [0, 0], share = [0, 0], cashIn = [0, 0], cashOut = [0, 0], cats = {};
  let total = 0, today = 0;
  list.forEach((e) => {
    if (e.kind === 'cash') { cashIn[e.by] += e.yen; return; }
    total += e.yen;
    if (e.date === tokyo.date) today += e.yen;
    cats[e.cat] = (cats[e.cat] || 0) + e.yen;
    paid[e.by] += e.yen;
    if (e.split === 'both') { share[0] += e.yen / 2; share[1] += e.yen / 2; } else share[+e.split] += e.yen;
    if (e.pay === 'cash') cashOut[e.by] += e.yen;
  });
  return { total, today, cats, bal: paid[0] - share[0], cash: [cashIn[0] - cashOut[0], cashIn[1] - cashOut[1]], hasCash: cashIn[0] + cashIn[1] > 0 };
}

function renderLedger() {
  const list = ledger(), nm = names(), st = ledgerStats(list);
  const settle = Math.abs(st.bal) < 1 ? '目前不用找錢 👍'
    : `<b>${esc(nm[st.bal > 0 ? 1 : 0])}</b> 要給 <b>${esc(nm[st.bal > 0 ? 0 : 1])}</b> ${yen(Math.abs(st.bal))}${asNtd(Math.abs(st.bal)) ? `<span class="opacity-80">（≈${asNtd(Math.abs(st.bal))}）</span>` : ''}`;
  const catRows = Object.entries(st.cats).sort((a, b) => b[1] - a[1]).map(([k, v]) => `

      <div class="flex-1 h-2 rounded-full bg-neutral-100 dark:bg-neutral-800 overflow-hidden"><div class="h-full rounded-full bg-rose-500" style="width:${v / st.total * 100}%"></div></div>

  const byDate = {};

    const di = DAYS.findIndex((d) => d.date === date);

    return `
      <div class="flex items-baseline justify-between px-1 mt-4 mb-1.5">
        <p class="text-[13px] font-bold text-neutral-500 dark:text-neutral-400">${di >= 0 ? `Day ${di + 1} · ${DAYS[di].md}（${DAYS[di].wd}）` : date}</p>
        <p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 tabular">${yen(sum)}</p>
      </div>
      <ul class="rounded-2xl bg-white dark:bg-neutral-900 shadow-sm divide-y divide-black/5 dark:divide-white/10">${rows.map((e) => `
        <li><button data-led-edit="${e.id}" class="tap w-full flex items-center gap-3 px-3.5 py-2.5 text-left">
          <span class="text-[20px]">${e.kind === 'cash' ? '🏧' : catOf(e.cat).split(' ')[0]}</span>
          <span class="flex-1 min-w-0">
            <span class="block text-[14.5px] font-semibold truncate">${esc(e.note) || (e.kind === 'cash' ? '現金入帳' : catOf(e.cat).split(' ')[1])}</span>
            <span class="block text-[11.5px] text-neutral-500 dark:text-neutral-400">${esc(nm[e.by])} ${e.kind === 'cash' ? '存入' : `付・${payOf(e.pay)}・${e.split === 'both' ? '平分' : `只算${esc(nm[+e.split])}`}`}</span>
          </span>
          <span class="text-right tabular">
            <span class="block text-[15px] font-bold ${e.kind === 'cash' ? 'text-emerald-600 dark:text-emerald-400' : ''}">${e.kind === 'cash' ? '+' : ''}${yen(e.yen)}</span>
            <span class="block text-[11px] text-neutral-400">${asNtd(e.yen)}</span>
          </span>
        </button></li>`).join('')}</ul>`;
  }).join('');

  return `
    <section class="fade-in rounded-3xl p-5 text-white shadow-lg mb-3" style="background:linear-gradient(135deg,#F43F5E,#FB923C)">
      <p class="text-[13px] font-semibold opacity-90">旅程總花費</p>
      <p class="text-[36px] font-bold leading-tight tabular">${yen(st.total)}</p>
      <p class="text-[14px] opacity-90 tabular">${asNtd(st.total) ? `≈ ${asNtd(st.total)}・` : ''}今天 ${yen(st.today)}</p>
      <div class="mt-3 pt-3 border-t border-white/25 flex items-center justify-between gap-2 text-[14px]">
        <span>🤝 ${settle}</span>
        <button data-led-names class="tap shrink-0 rounded-full bg-white/20 text-[12px] font-semibold px-3 py-1">改名字</button>
      </div>
    </section>
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button data-led-new="spend" class="tap rounded-xl bg-rose-600 text-white text-[15px] font-semibold py-3">＋ 記一筆</button>
      <button data-led-new="cash" class="tap rounded-xl bg-white dark:bg-neutral-900 shadow-sm text-[14px] font-semibold py-3">🏧 現金入帳</button>
    </div>
    ${st.hasCash ? card('💴 現金剩多少', `
      <div class="grid grid-cols-2 gap-2">${nm.map((n, i) => `
        <div class="rounded-xl bg-neutral-100 dark:bg-neutral-800 px-3 py-2">
          <p class="text-[12px] text-neutral-500 dark:text-neutral-400">${esc(n)}</p>
          <p class="text-[18px] font-bold tabular ${st.cash[i] < 0 ? 'text-rose-600' : ''}">${yen(st.cash[i])}</p></div>`).join('')}</div>
      <p class="text-[11.5px] text-neutral-400 mt-2">換匯或提款時按「現金入帳」，用現金付的花費會自動扣掉</p>`) : ''}
    ${catRows ? card('📊 花費分類', `<div class="space-y-2">${catRows}</div>`) : ''}
    ${groups || '<p class="text-center text-[13.5px] text-neutral-500 dark:text-neutral-400 py-8">還沒有記帳紀錄<br>在「換算」算好價錢後也可以直接按「記一筆」</p>'}
    <p class="text-[11.5px] text-neutral-400 text-center mt-5">🔒 記帳只存在這支手機・台幣以目前匯率估算，不含刷卡手續費</p>`;
}

/* 新增／編輯一筆：from = spend | cash | calc | basket，或傳入既有紀錄 */
function editLedger(from, e) {
  const nm = names();
  if (!e) {
    const b = basket(), tb = basketTotal(b);
    const yenVal = from === 'calc' ? Math.round(calcAmounts().pay)
      : from === 'basket' ? Math.round(tb / 1.1 >= TAXFREE ? tb / 1.1 : tb) : '';
    e = { id: uid(), kind: from === 'cash' ? 'cash' : 'spend', yen: yenVal || '', cat: from === 'spend' ? 'food' : 'shop', pay: 'card', by: 0, split: 'both',
      note: from === 'basket' ? b.store : from === 'cash' ? '換匯／提款' : '', date: DAYS.some((d) => d.date === tokyo.date) ? tokyo.date : DAYS[0].date, fromBasket: from === 'basket' };
  }
  const isNew = !ledger().some((x) => x.id === e.id);
  const who = nm.map((n, i) => [i, esc(n)]);
  openSheet(e.kind === 'cash' ? '🏧 現金入帳' : isNew ? '📝 記一筆' : '編輯紀錄', `
    <form id="ledForm" data-id="${e.id}" data-kind="${e.kind}" data-basket="${e.fromBasket ? 1 : ''}" onsubmit="return false">
      ${field('金額（日圓）', `<input name="yen" type="number" inputmode="numeric" min="0" value="${e.yen}" placeholder="0" class="${INPUT} !text-[26px] font-bold tabular">`)}
      ${e.kind === 'cash' ? chipGroup('存到誰的錢包', 'by', who, e.by) : `
        ${chipGroup('分類', 'cat', CATS, e.cat)}
        ${chipGroup('付款方式', 'pay', PAYS, e.pay)}
        ${chipGroup('誰付的', 'by', who, e.by)}
        ${chipGroup('怎麼分', 'split', [['both', '兩人平分'], ['0', `只算${esc(nm[0])}`], ['1', `只算${esc(nm[1])}`]], e.split)}`}
      ${field('備註', `<input name="note" value="${esc(e.note)}" placeholder="${e.kind === 'cash' ? '換匯／提款' : '店名、買了什麼'}" class="${INPUT}">`)}
      ${field('日期', `<input name="date" type="date" value="${e.date}" class="${INPUT}">`)}
      ${e.fromBasket ? '<p class="text-[12.5px] text-neutral-500 dark:text-neutral-400">儲存後會清空退稅累計</p>' : ''}
    </form>
    ${sheetBtns('data-led-save', isNew ? '' : `data-led-del="${e.id}"`)}`);
}

function saveLedger() {
  const form = $('#ledForm'), f = new FormData(form);
  const yenVal = Math.round(+f.get('yen'));
  if (!(yenVal > 0)) { toast('請輸入金額'); return; }
  const e = { id: form.dataset.id, kind: form.dataset.kind, yen: yenVal, by: +(f.get('by') || 0), note: f.get('note').trim(),
    date: f.get('date') || tokyo.date, ts: Date.now() };
  if (e.kind !== 'cash') Object.assign(e, { cat: f.get('cat'), pay: f.get('pay'), split: f.get('split') });
  const list = ledger(), old = list.findIndex((x) => x.id === e.id);
  if (old >= 0) { e.ts = list[old].ts; list[old] = e; } else list.push(e);
  writeJson('ledger', list);
  if (form.dataset.basket) store.del('basket');
  closeSheet();
  render({ keepScroll: true, quiet: true });
  toast(state.wallet === 'ledger' ? '已儲存' : '已記帳，可到「記帳」查看');
}

/* ---------- 天氣預報（Open-Meteo JMA，日本氣象廳模型） ---------- */
/* 以飯店（上野）為代表點；JMA 預報約 11 天，超過範圍的日子會回傳 null */
const WX_API = 'https://api.open-meteo.com/v1/jma?' + new URLSearchParams({
  latitude: '35.7197', longitude: '139.7787', timezone: 'Asia/Tokyo',
  start_date: DAYS[0].date, end_date: DAYS[DAYS.length - 1].date,
  daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_min,precipitation_sum,wind_speed_10m_max',
  hourly: 'temperature_2m,weather_code,precipitation',
});
const WX_TTL = 60 * 60000; // 1 小時內不重抓
let wxLoading = false, wxError = false;

const WMO = [
  [[0], '☀️', '晴'], [[1], '🌤️', '大致晴朗'], [[2], '⛅', '晴時多雲'], [[3], '☁️', '陰天'],
  [[45, 48], '🌫️', '霧'], [[51, 53, 55], '🌦️', '毛毛雨'], [[56, 57], '🌧️', '凍毛毛雨'],
  [[61], '🌧️', '小雨'], [[63], '🌧️', '中雨'], [[65], '🌧️', '大雨'], [[66, 67], '🌧️', '凍雨'],
  [[71, 73, 75, 77], '🌨️', '雪'], [[80, 81], '🌦️', '陣雨'], [[82], '⛈️', '強陣雨'], [[85, 86], '🌨️', '陣雪'],
  [[95], '⛈️', '雷雨'], [[96, 99], '⛈️', '雷雨伴隨冰雹'],
];
const wmo = (c) => { const m = WMO.find(([cs]) => cs.includes(c)); return m ? { icon: m[1], text: m[2] } : { icon: '🌡️', text: '—' }; };
const isRainCode = (c) => c >= 51;

/* 把 API 回傳整理成 { 'YYYY-MM-DD': { code, max, min, feel, rain, wind, hours: [{ h, t, code, p }] } } */
function wxParse(j) {
  const out = {}, d = j.daily, h = j.hourly;
  d.time.forEach((date, i) => {
    if (d.weather_code[i] == null || d.temperature_2m_max[i] == null) return;
    out[date] = { code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i],
      feel: d.apparent_temperature_min[i], rain: d.precipitation_sum[i] ?? 0, wind: d.wind_speed_10m_max[i] ?? 0, hours: [] };
  });
  h.time.forEach((t, i) => {
    const day = out[t.slice(0, 10)];
    if (day && h.temperature_2m[i] != null) day.hours.push({ h: +t.slice(11, 13), t: h.temperature_2m[i], code: h.weather_code[i], p: h.precipitation[i] ?? 0 });
  });
  return out;
}

let wxMem;
const wxCache = () => { if (wxMem === undefined) { const c = readJson('wx'); wxMem = c.days ? c : null; } return wxMem; };
const wxDay = (date) => wxCache()?.days[date] || null;

async function fetchWeather(force) {
  const c = wxCache();
  if (wxLoading || (!force && c && Date.now() - c.at < WX_TTL)) return;
  wxLoading = true; wxError = false;
  if (force) render({ keepScroll: true, quiet: true });
  try {
    const r = await fetch(WX_API, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    wxMem = { at: Date.now(), days: wxParse(await r.json()) };
    store.set('wx', JSON.stringify(wxMem));
  } catch (e) {
    wxError = true;
  }
  wxLoading = false;
  renderPills();
  if (DAY_TABS.includes(state.tab)) render({ keepScroll: true, quiet: true });
}

/* 依預報給出門準備建議 */
function wxAdvice(w) {
  const a = [];
  const rainHours = w.hours.filter((x) => x.p >= 0.5 && x.h >= 7 && x.h <= 22).map((x) => x.h);
  if (w.rain >= 10) a.push(['☔', '雨量偏多，帶傘並穿防水鞋，戶外行程準備室內備案']);
  else if (w.rain >= 1 || rainHours.length || isRainCode(w.code)) a.push(['☂️', rainHours.length ? `約 ${rainHours[0]}:00 起可能下雨，記得帶傘` : '可能有零星降雨，包包放把摺疊傘']);
  if (w.wind >= 30) a.push(['💨', `最大風速約 ${Math.round(w.wind)} km/h，風大，摺疊傘容易翻`]);
  if (w.max >= 28) a.push(['🥵', '白天偏熱，注意補水、防曬']);
  if (w.min <= 15 || w.feel <= 14) a.push(['🧥', '早晚偏涼，帶件薄外套']);
  else if (w.max - w.min >= 8) a.push(['🧅', `日夜溫差約 ${Math.round(w.max - w.min)}°，洋蔥式穿搭方便加減`]);
  if (!a.length) a.push(['👍', '天氣穩定，適合整天在外面走']);
  return a;
}

/* 該行程時段內預計會下雨的話，回傳最早下雨的整點 */
function rainDuring(w, s, it) {
  if (!w || it.tw || it.icon === '✈️') return null;
  const hit = w.hours.find((x) => x.p >= 0.5 && x.h * 60 + 59 >= s.start && x.h * 60 < s.end);
  return hit ? hit.h : null;
}

  const foot = wxError ? (c ? '更新失敗（離線？），先顯示上次的預報' : '天氣取得失敗，請連網後按「更新」')
    : c ? `日本氣象廳 JMA 模型・東京上野・更新於 ${new Date(c.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}` : '';

  if (!w) {
    const from = new Date(d.date); from.setDate(from.getDate() - 10);
    const msg = !c && wxLoading ? '正在取得天氣預報…'

        <div class="flex items-center gap-3">
          <span class="text-[26px]">🌤️</span>

          </div>
          ${btn}
        </div>
        ${foot ? `<p class="text-[11px] text-neutral-400 mt-2">${foot}</p>` : ''}
      </section>`;
  }

  const m = wmo(w.code);
  const hrs = w.hours.filter((x) => x.h >= 6 && x.h % 2 === 0);
  const strip = hrs.map((x) => `
    <div class="shrink-0 w-[46px] text-center">
      <p class="text-[11px] text-neutral-500 dark:text-neutral-400 tabular">${x.h}時</p>
      <p class="text-[20px] leading-tight my-0.5">${wmo(x.code).icon}</p>
      <p class="text-[13px] font-semibold tabular">${Math.round(x.t)}°</p>
      <p class="text-[10.5px] tabular ${x.p >= 0.5 ? 'text-sky-600 dark:text-sky-400 font-semibold' : 'text-transparent'}">${x.p >= 0.1 ? x.p.toFixed(1) : '0'}mm</p>
    </div>`).join('');

  return `
    <section class="fade-in rounded-2xl bg-white dark:bg-neutral-900 shadow-sm p-4 mb-4">
      <div class="flex items-start gap-3">
        <span class="text-[40px] leading-none">${m.icon}</span>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-neutral-500 dark:text-neutral-400">天氣預報 · ${m.text}</p>
          <p class="text-[24px] font-bold leading-tight tabular">${Math.round(w.max)}° <span class="text-neutral-400 font-semibold text-[18px]">/ ${Math.round(w.min)}°</span></p>
          <p class="text-[12.5px] text-neutral-500 dark:text-neutral-400 tabular mt-0.5">
            ☔ ${w.rain.toFixed(1)} mm · 💨 ${Math.round(w.wind)} km/h</p>
        </div>
        ${btn}
      </div>
      ${strip ? `<div class="flex overflow-x-auto no-scrollbar -mx-1 mt-3 pt-3 border-t border-neutral-200/70 dark:border-neutral-800">${strip}</div>` : ''}
      <ul class="mt-3 space-y-1.5">
        ${wxAdvice(w).map(([i, t]) => `<li class="flex gap-2 rounded-lg bg-sky-50 dark:bg-sky-400/10 px-2.5 py-1.5 text-[13px] leading-snug text-sky-900 dark:text-sky-100/90"><span>${i}</span><span>${t}</span></li>`).join('')}
      </ul>
      ${foot ? `<p class="text-[11px] text-neutral-400 mt-2">${foot}</p>` : ''}
    </section>`;
}

/* ---------- 票券（IndexedDB，只存在這支手機，不會上傳） ---------- */
const DB = (() => {
  let conn;
  const open = () => conn ||= new Promise((res, rej) => {
    const r = indexedDB.open('tokyo-trip', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tickets', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = (mode, fn) => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction('tickets', mode), req = fn(t.objectStore('tickets'));
    t.oncomplete = () => res(req.result);
    t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    all: () => run('readonly', (s) => s.getAll()),
    put: (v) => run('readwrite', (s) => s.put(v)),
    del: (id) => run('readwrite', (s) => s.delete(id)),
  };
})();
let tickets = null;   // 載入後是陣列
let draft = null;     // 編輯中的票券

async function loadTickets() {
  try { tickets = await DB.all(); } catch (e) { tickets = []; toast('票券資料讀取失敗'); }
  if (state.tab === 'ticket') render({ keepScroll: true, quiet: true });
}

/* 縮小截圖再存（QR Code 1800px 仍很清楚） */
function shrinkImage(file, max = 1800) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

    <article class="fade-in rounded-2xl bg-white dark:bg-neutral-900 shadow-sm p-3.5 mb-2.5">
      <div class="flex items-start gap-2.5">
        <span class="text-[22px] leading-none mt-0.5">${icon}</span>
        <div class="min-w-0 flex-1">
          <p class="text-[12px] font-semibold text-neutral-500 dark:text-neutral-400 tabular">${time || '—'}</p>
          <h3 class="text-[15.5px] font-semibold leading-snug">${title}</h3>
          ${tags?.length ? `<div class="flex flex-wrap gap-1.5 mt-1.5">${tags.map((x) => `<span class="rounded-full ${x.includes('還沒') ? 'bg-rose-600 text-white' : 'bg-rose-100 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300'} text-[11px] font-semibold px-2 py-0.5">${x}</span>`).join('')}</div>` : ''}
        </div>
        <button ${edit} class="tap shrink-0 rounded-full bg-neutral-100 dark:bg-neutral-800 text-[12px] font-semibold px-2.5 py-1">${has ? '編輯' : '＋ 加入'}</button>
      </div>
      ${t?.code ? `
        <div class="mt-3 flex items-center gap-2 rounded-xl bg-neutral-100 dark:bg-neutral-800 px-3 py-2">
          <span class="text-[11.5px] text-neutral-500 dark:text-neutral-400 shrink-0">訂位編號</span>
          <span class="flex-1 min-w-0 text-[17px] font-bold font-mono tracking-wide break-all select-text">${esc(t.code)}</span>

    </article>`;

function renderTicket() {
  if (!tickets) return '<p class="text-center text-neutral-500 py-10">載入中…</p>';
  const bySlot = Object.fromEntries(tickets.filter((t) => t.slot).map((t) => [t.slot, t]));
  const slotKeys = new Set(SLOTS.map((x) => x.key));
  const slotCard = (x) => ticketCard({ icon: x.it.icon, time: x.it.t + (x.it.tw ? '（台灣）' : ''), title: x.it.title, tags: x.it.tags,
    t: bySlot[x.key], edit: `data-tk-slot="${esc(x.key)}"` });
  const customCard = (t) => ticketCard({ icon: '🎫', time: t.time, title: esc(t.title), t, edit: `data-tk-id="${t.id}"` });
  const byTime = (a, b) => (a.time || '').localeCompare(b.time || '');

  const n = nextSlot();
  const nt = n && bySlot[n.key];
  const next = n ? `
    <section class="fade-in rounded-3xl p-5 text-white shadow-lg mb-4" style="background:linear-gradient(135deg,${DAYS[n.di].color[0]},${DAYS[n.di].color[1]})">
      <p class="text-[13px] font-semibold opacity-90">下一個 · ${DAYS[n.di].md}（${DAYS[n.di].wd}）${n.it.t}</p>
      <p class="text-[22px] font-bold leading-tight mt-0.5">${n.it.icon} ${n.it.title}</p>
      <p class="text-[15px] font-semibold opacity-95 mt-1 tabular">${untilText(minsUntil(n))}</p>
      ${nt?.imgs?.length || safeUrl(nt?.link) ? `<div class="grid ${nt.imgs?.length && safeUrl(nt.link) ? 'grid-cols-2' : ''} gap-2 mt-3">
        ${nt.imgs?.length ? `<button data-view="${nt.id}:0" class="tap rounded-xl bg-white/20 py-2.5 text-[15px] font-semibold">出示 QR Code</button>` : ''}
        ${safeUrl(nt.link) ? `<a href="${esc(safeUrl(nt.link))}" target="_blank" rel="noopener noreferrer" class="tap rounded-xl bg-white/20 py-2.5 text-[15px] font-semibold text-center">🔗 票券頁面</a>` : ''}
      </div>` : ''}
    </section>` : '';

  const todo = SLOTS.filter((x) => x.it.tags?.some((t) => t.includes('還沒')));
  const todoCard = todo.length ? `
    <section class="fade-in rounded-2xl bg-rose-50 dark:bg-rose-500/10 border border-rose-200/70 dark:border-rose-400/20 p-4 mb-4">
      <p class="text-[13px] font-bold text-rose-700 dark:text-rose-300 mb-1">⚠️ 還沒處理</p>
      ${todo.map((x) => `<p class="text-[14px] leading-relaxed">${DAYS[x.di].md} ${x.it.title} · ${x.it.tags.filter((t) => t.includes('還沒')).join('、')}</p>`).join('')}
    </section>` : '';

  const groups = DAYS.map((d, di) => {
    const slots = SLOTS.filter((x) => x.di === di);
    const customs = tickets.filter((t) => !t.slot && t.date === d.date).sort(byTime);
    if (!slots.length && !customs.length) return '';
    return `<p class="text-[13px] font-bold text-neutral-500 dark:text-neutral-400 px-1 mt-4 mb-1.5">Day ${di + 1} · ${d.md}（${d.wd}）${d.title}</p>`
      + slots.map(slotCard).join('') + customs.map(customCard).join('');
  }).join('');
  /* 行程改過名稱而對不上的舊票券、沒有指定日期的票券 */
  const others = tickets.filter((t) => (t.slot && !slotKeys.has(t.slot)) || (!t.slot && !DAYS.some((d) => d.date === t.date)));
  const otherBlock = others.length ? `<p class="text-[13px] font-bold text-neutral-500 dark:text-neutral-400 px-1 mt-4 mb-1.5">其他</p>`
    + others.map((t) => t.slot ? ticketCard({ icon: '🎫', time: t.slot.split('|')[0], title: esc(t.slot.split('|')[1]), t, edit: `data-tk-id="${t.id}"` }) : customCard(t)).join('') : '';

  return next + todoCard + `
    <button data-tk-new class="tap w-full rounded-xl bg-white dark:bg-neutral-900 shadow-sm text-[14.5px] font-semibold py-3 mb-1">＋ 新增其他票券（車票、門票…）</button>`
    + groups + otherBlock + `
    <p class="text-[11.5px] text-neutral-400 text-center mt-5 leading-relaxed">🔒 訂位編號和截圖只存在這支手機，不會上傳到網站<br>記得到「工具 → 備份」匯出一份，以免資料被清掉</p>`;
}

function editTicket({ slot, id }) {
  const t = id ? tickets.find((x) => x.id === id) : tickets.find((x) => x.slot === slot);
  const sl = slot ? SLOTS.find((x) => x.key === slot) : null;
  draft = t ? { ...t, imgs: [...(t.imgs || [])] }
    : { id: uid(), slot: slot || null, title: '', date: DAYS.some((d) => d.date === tokyo.date) ? tokyo.date : DAYS[0].date, time: '', code: '', link: '', note: '', imgs: [] };
  const head = sl ? `<p class="text-[15px] font-semibold mb-3">${sl.it.icon} ${DAYS[sl.di].md} ${sl.it.t} · ${sl.it.title}</p>`
    : draft.slot ? `<p class="text-[15px] font-semibold mb-3">🎫 ${esc(draft.slot.replace('|', ' · '))}</p>` : `
      ${field('名稱', `<input name="title" value="${esc(draft.title)}" placeholder="例：Skyliner 回程、迪士尼門票" class="${INPUT}">`)}
      <div class="grid grid-cols-2 gap-2">
        ${field('日期', `<select name="date" class="${INPUT}">${DAYS.map((d, i) => `<option value="${d.date}" ${d.date === draft.date ? 'selected' : ''}>Day ${i + 1} · ${d.md}</option>`).join('')}
          <option value="" ${draft.date ? '' : 'selected'}>不指定</option></select>`)}
        ${field('時間', `<input name="time" type="time" value="${esc(draft.time)}" class="${INPUT}">`)}
      </div>`;
  openSheet(t ? '編輯票券' : '新增票券', `
    <form id="tkForm" onsubmit="return false">
      ${head}
      ${field('訂位編號／確認碼', `<input name="code" value="${esc(draft.code)}" autocomplete="off" autocapitalize="characters" spellcheck="false" class="${INPUT} font-mono">`)}
      ${field('票券頁面連結（當天才顯示 QR Code 的票）', `<input name="link" type="url" inputmode="url" value="${esc(draft.link)}" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false" class="${INPUT}">`)}
      ${field('備註', `<textarea name="note" rows="2" placeholder="人數、座位、取票方式…" class="${INPUT}">${esc(draft.note)}</textarea>`)}
      <p class="text-[12.5px] font-semibold text-neutral-500 dark:text-neutral-400 mb-1.5">QR Code／票券截圖</p>
      <div id="draftImgs" class="flex flex-wrap gap-2">${draftImgs()}</div>
    </form>
    ${sheetBtns('data-tk-save', t ? 'data-tk-del' : '')}`);
}

function draftImgs() {
  return draft.imgs.map((src, k) => `
    <div class="relative"><img src="${esc(src)}" alt="" class="h-20 w-20 rounded-xl object-cover">
      <button data-draft-del="${k}" class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-neutral-800 text-white text-[12px] font-bold" aria-label="移除">✕</button></div>`).join('') + `
    <label class="tap h-20 w-20 rounded-xl border-2 border-dashed border-neutral-300 dark:border-neutral-700 flex flex-col items-center justify-center text-neutral-500 text-[12px] font-semibold cursor-pointer">
      <span class="text-[22px] leading-none">＋</span>加入截圖
      <input id="tkFile" type="file" accept="image/*" multiple class="hidden"></label>`;
}

async function saveTicket() {
  const f = new FormData($('#tkForm'));
  if (!draft.slot) { draft.title = (f.get('title') || '').trim() || '未命名票券'; draft.date = f.get('date') || ''; draft.time = f.get('time') || ''; }
  draft.code = f.get('code').trim();
  draft.note = f.get('note').trim();
  const link = f.get('link').trim();
  if (link && !safeUrl(link)) { toast('連結格式不對，請貼上 https:// 開頭的網址'); return; }
  draft.link = safeUrl(link) || '';
  draft.updated = Date.now();
  try {
    /* 行程內建的欄位清空時直接刪掉紀錄 */
    if (draft.slot && !draft.code && !draft.note && !draft.link && !draft.imgs.length) await DB.del(draft.id);
    else await DB.put(draft);
    tickets = await DB.all();
  } catch (e) { toast('儲存失敗（空間不足？）'); return; }
  navigator.storage?.persist?.().catch(() => {});
  closeSheet();
  render({ keepScroll: true, quiet: true });
  toast('已儲存在這支手機');
}

/* 行事曆檔：時間一律換成 UTC，手機會自動轉成當地時間 */
function buildIcs() {
  const pad = (n) => String(n).padStart(2, '0');
  const utc = (date, min) => {
    const [y, m, d] = date.split('-').map(Number), t = new Date(Date.UTC(y, m - 1, d, 0, min - 540));
    return `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00Z`;
  };
  const txt = (s) => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, (c) => '\\' + c);
  const stamp = utc(tokyo.date, tokyo.min);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tokyo-trip//zh-TW', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:東京旅行'];
  DAYS.forEach((d) => {
    const sc = schedule(d);
    d.items.forEach((it, i) => {
      if (!(isTicket(it) || it.remind)) return;
      const desc = [it.note, ...(it.tags || [])].filter(Boolean).join('\n');
      lines.push('BEGIN:VEVENT', `UID:${d.date}-${i}@tokyo-trip`, `DTSTAMP:${stamp}`,
        `DTSTART:${utc(d.date, sc[i].start)}`, `DTEND:${utc(d.date, Math.max(sc[i].end, sc[i].start + 15))}`,
        `SUMMARY:${txt(`${it.icon} ${it.title}`)}`, ...(desc ? [`DESCRIPTION:${txt(desc)}`] : []),
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${txt(it.title)}`, `TRIGGER:-PT${it.alarm ?? 30}M`, 'END:VALARM', 'END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* 備份：localStorage（天氣快取除外）＋ 票券 */
async function exportBackup() {
  const ls = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k !== 'wx') ls[k] = localStorage.getItem(k); } } catch (e) {}
  const data = { app: 'tokyo-trip', v: 1, at: new Date().toISOString(), ls, tickets: tickets || await DB.all() };
  await saveFile(`tokyo-backup-${tokyo.date.replace(/-/g, '')}.json`, JSON.stringify(data), 'application/json', true);
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (data?.app !== 'tokyo-trip') { toast('這不是東京旅行的備份檔'); return; }
  if (!confirm(`要用 ${new Date(data.at).toLocaleString('zh-TW', { hour12: false })} 的備份覆蓋這支手機的資料嗎？`)) return;
  Object.entries(data.ls || {}).forEach(([k, v]) => store.set(k, v));
  try { for (const t of data.tickets || []) await DB.put(t); tickets = await DB.all(); } catch (e) { toast('票券還原失敗'); return; }
  state.wallet = store.get('wallet') === 'ledger' ? 'ledger' : 'calc';
  render({ keepScroll: true, quiet: true });
  toast('已還原備份');
}

/* ---------- 主渲染 ---------- */
const VIEWS = { plan: ['行程', renderPlan], route: ['交通', renderRoute], ticket: ['票券', renderTicket], calc: ['錢包', renderWallet], tools: ['工具', renderTools] };
const DAY_TABS = ['plan', 'route'];   // 有日期列、可左右滑動切換天數的分頁

function render(opts = {}) {
  const [title, view] = VIEWS[state.tab];
  $('#pageTitle').textContent = title;
  $('#dayPills').classList.toggle('hidden', !DAY_TABS.includes(state.tab));
  document.querySelectorAll('.tab-btn').forEach((b) => {
    const on = b.dataset.tab === state.tab;
    b.classList.toggle('text-rose-600', on);
    b.classList.toggle('dark:text-rose-400', on);
    b.classList.toggle('text-neutral-400', !on);
  });
  if (!opts.quiet) renderPills();
  $('#view').classList.toggle('quiet', !!opts.quiet);
  $('#view').innerHTML = view();
  if (state.tab === 'calc') {
    updateCalc();
    if (!opts.quiet) fetchRate();
  }
  if (!opts.keepScroll) window.scrollTo({ top: 0 });
  store.set('day', state.day);
  store.set('tab', state.tab);
}

function setDay(i) {
  if (i < 0 || i >= DAYS.length || i === state.day) return;
  state.day = i;
  render();
}

/* =========================================================
   互動
   ========================================================= */
document.addEventListener('click', (e) => {
  const pill = e.target.closest('[data-day]');
  if (pill) return setDay(+pill.dataset.day);

  const tab = e.target.closest('[data-tab]');
  if (tab) { if (tab.dataset.tab !== state.tab) { state.tab = tab.dataset.tab; render(); } else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const act = (sel) => e.target.closest(sel);
  const quiet = () => render({ keepScroll: true, quiet: true });
  let el;

  /* 編輯面板 */
  if (act('[data-sheet-close]')) { closeSheet(); return; }
  if ((el = act('[data-draft-del]'))) { draft.imgs.splice(+el.dataset.draftDel, 1); $('#draftImgs').innerHTML = draftImgs(); return; }
  if (act('[data-tk-save]')) { saveTicket(); return; }
  if (act('[data-tk-del]')) {
    if (!confirm('確定刪除這張票券的資料？')) return;
    DB.del(draft.id).then(DB.all).then((t) => { tickets = t; closeSheet(); quiet(); });
    return;
  }
  if (act('[data-led-save]')) { saveLedger(); return; }
  if ((el = act('[data-led-del]'))) {
    if (!confirm('確定刪除這筆紀錄？')) return;
    writeJson('ledger', ledger().filter((x) => x.id !== el.dataset.ledDel));
    closeSheet(); quiet(); return;
  }
  if (act('[data-names-save]')) {
    const f = new FormData($('#namesForm'));
    writeJson('ledger-cfg', { names: [f.get('n0').trim() || '我', f.get('n1').trim() || '旅伴'] });
    closeSheet(); quiet(); return;
  }
  if (act('[data-me-save]')) {
    const f = new FormData($('#meForm'));
    writeJson('me', Object.fromEntries(ME_FIELDS.map(([k]) => [k, (f.get(k) || '').trim()])));
    closeSheet(); quiet(); toast('已儲存在這支手機'); return;
  }
  if (act('[data-wish-save]')) {
    const form = $('#wishForm'), f = new FormData(form);
    const name = f.get('name').trim();
    if (!name) { toast('請輸入想買什麼'); return; }
    const list = wishes(), old = list.find((x) => x.id === form.dataset.id);
    const w = { id: form.dataset.id, name, budget: f.get('budget'), note: f.get('note').trim(), shops: f.getAll('shops'), done: old?.done || false };
    writeJson('wish', old ? list.map((x) => (x.id === w.id ? w : x)) : [...list, w]);
    closeSheet(); quiet(); return;
  }
  if ((el = act('[data-wish-del]'))) { writeJson('wish', wishes().filter((x) => x.id !== el.dataset.wishDel)); closeSheet(); quiet(); return; }

  /* 票券 */
  if ((el = act('[data-tk-slot]'))) { editTicket({ slot: el.dataset.tkSlot }); return; }
  if ((el = act('[data-tk-id]'))) { editTicket({ id: el.dataset.tkId }); return; }
  if (act('[data-tk-new]')) { editTicket({}); return; }
  if ((el = act('[data-view]'))) {
    const [id, k] = el.dataset.view.split(':'), src = tickets?.find((t) => t.id === id)?.imgs?.[+k];
    if (src) openFull(`<img src="${esc(src)}" alt="" class="max-w-full max-h-[85vh] object-contain"><p class="text-[13px] text-neutral-400 mt-3">記得把螢幕亮度調高</p>`);
    return;
  }
  if ((el = act('[data-copy]'))) {
    navigator.clipboard?.writeText(el.dataset.copy).then(() => toast('已複製'), () => toast('無法複製，請長按選取'));
    return;
  }

  /* 錢包 */
  if ((el = act('[data-wallet]'))) { state.wallet = el.dataset.wallet; store.set('wallet', state.wallet); quiet(); return; }
  if ((el = act('[data-led-new]'))) { editLedger(el.dataset.ledNew); return; }
  if ((el = act('[data-led-edit]'))) { editLedger(null, ledger().find((x) => x.id === el.dataset.ledEdit)); return; }
  if (act('[data-led-names]')) { editNames(); return; }
  if (act('[data-basket-add]')) {
    const v = Math.round(calcAmounts().afterDisc);
    if (!v) { toast('先輸入標價'); return; }
    const b = basket(); b.items.push(v); writeJson('basket', b);
    quiet(); toast(`已加入 ${yen(v)}`); return;
  }
  if ((el = act('[data-basket-del]'))) { const b = basket(); b.items.splice(+el.dataset.basketDel, 1); writeJson('basket', b); quiet(); return; }
  if (act('[data-basket-clear]')) { store.del('basket'); quiet(); return; }

  /* 工具 */
  if ((el = act('[data-big]'))) { showBig(el.dataset.big); return; }
  if (act('[data-me-edit]')) { editMe(); return; }
  if ((el = act('[data-pack]'))) {
    const done = readJson('pack'), k = el.dataset.pack;
    done[k] = !done[k]; writeJson('pack', done); quiet(); return;
  }
  if (act('[data-pack-add]')) {
    const v = $('#packNew').value.trim(), list = readArr('pack-extra');
    if (v && !list.includes(v) && !PACK.some((g) => g[1].includes(v))) { writeJson('pack-extra', [...list, v]); quiet(); }
    return;
  }
  if ((el = act('[data-pack-del]'))) { writeJson('pack-extra', readArr('pack-extra').filter((x) => x !== el.dataset.packDel)); quiet(); return; }
  if ((el = act('[data-wish-edit]'))) { editWish(el.dataset.wishEdit); return; }
  if ((el = act('[data-wish-done]'))) {
    writeJson('wish', wishes().map((x) => (x.id === el.dataset.wishDone ? { ...x, done: !x.done } : x)));
    quiet(); return;
  }
  if (act('[data-ics]')) { saveFile('tokyo-trip.ics', buildIcs(), 'text/calendar', false); return; }
  if (act('[data-backup-export]')) { exportBackup(); return; }

  /* 行程：今天要帶 */
  if ((el = act('[data-bring]'))) {
    const k = 'bring-' + DAYS[state.day].date, done = readJson(k);
    done[el.dataset.bring] = !done[el.dataset.bring]; writeJson(k, done); quiet(); return;
  }

  const pct = e.target.closest('[data-pct]');
  if (pct) { saveCalc({ pct: +pct.dataset.pct }); render({ keepScroll: true, quiet: true }); return; }
  if (e.target.closest('[data-calc-clear]')) { saveCalc({ price: '' }); updateCalc(); $('#calcPrice').value = ''; $('#calcPrice').focus(); return; }
  if (e.target.closest('[data-calc-rate]')) { fetchRate(); return; }
  if (e.target.closest('[data-wx-refresh]')) { fetchWeather(true); return; }

  const here = e.target.closest('[data-here]');
  if (here) {
    const key = 'here-' + DAYS[state.day].date;
    if (store.get(key) === here.dataset.here) store.del(key); else store.set(key, here.dataset.here);
    render({ keepScroll: true, quiet: true });
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const i = +pick.dataset.pick, shop = DAYS[state.day].items[i].shops.list.find((s) => s.k === pick.dataset.k);
    const picks = readJson(picksKey());
    picks[`${i}:${shop.k}`] = !isPicked(picks, i, shop);
    store.set(picksKey(), JSON.stringify(picks));
    render({ keepScroll: true, quiet: true });
    return;
  }
  const reset = e.target.closest('[data-reset-picks]');
  if (reset) {
    const picks = readJson(picksKey());
    Object.keys(picks).forEach((k) => { if (k.startsWith(reset.dataset.resetPicks + ':')) delete picks[k]; });
    store.set(picksKey(), JSON.stringify(picks));
    render({ keepScroll: true, quiet: true });
    return;
  }
  const tog = e.target.closest('[data-toggle-shops]');
  if (tog) {
    const i = +tog.dataset.toggleShops, open = readJson(openKey());
    open[i] = !shopsOpen(i);
    store.set(openKey(), JSON.stringify(open));
    render({ keepScroll: true, quiet: true });
    return;
  }

  if (e.target.closest('[data-clear-here]')) {
    store.del('here-' + DAYS[state.day].date);
    render({ keepScroll: true, quiet: true });
    return;
  }

  const go = e.target.closest('[data-goleg]');
  if (go) {
    state.tab = 'route';
    render();
    const el = document.getElementById('leg-' + go.dataset.goleg);
    if (el) {
      const headerH = document.querySelector('header').offsetHeight;
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - headerH - 12, behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }
});

/* 計算器輸入：即時更新結果 */
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'calcPrice') saveCalc({ price: e.target.value });
  else if (id === 'calcPct') saveCalc({ pct: e.target.value });
  else if (id === 'calcTwd') saveCalc({ twd: e.target.value });
  else if (id === 'basketStore') { writeJson('basket', { ...basket(), store: e.target.value }); return; }
  else return;
  updateCalc();
});
document.addEventListener('change', async (e) => {
  if (e.target.id === 'tkFile') {
    const files = [...e.target.files];
    for (const f of files) { try { draft.imgs.push(await shrinkImage(f)); } catch (err) { toast('有一張圖片讀不到'); } }
    $('#draftImgs').innerHTML = draftImgs();
    return;
  }
  if (e.target.id === 'backupFile') {
    const f = e.target.files[0];
    if (f) await importBackup(f);
    e.target.value = '';
    return;
  }
  const k = e.target.dataset?.calc;
  if (!k) return;
  saveCalc({ [k]: e.target.checked });
  if (k === 'disc') $('#calcDiscBox').classList.toggle('hidden', !e.target.checked);
  updateCalc();
});

/* 左右滑動切換天數 */
let sx = 0, sy = 0, st = 0;
const main = $('#view');
main.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
main.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (DAY_TABS.includes(state.tab) && Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) setDay(state.day + (dx < 0 ? 1 : -1));
}, { passive: true });

/* 回到前景時更新「現在」標示 */
function refreshClock() {
  tokyo = tokyoNow();
  todayIdx = DAYS.findIndex((d) => d.date === tokyo.date);
  renderStatus();
  /* 有輸入框的分頁不重繪，避免打字到一半被打斷 */
  if ([...DAY_TABS, 'ticket'].includes(state.tab) && !$('#sheet')) render({ keepScroll: true, quiet: true });
  fetchWeather();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClock(); });
setInterval(() => { if (!document.hidden && !SIM && state.tab === 'plan' && state.day === todayIdx) refreshClock(); }, 60000);

/* 離線快取（sw.js）；本機直接開檔案時不支援 */
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderStatus();
render();
fetchWeather();
loadTickets();
</script>
</body>
